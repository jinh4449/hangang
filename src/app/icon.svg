<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#1E5B45"/>
  <!-- 병원 로고. 원본 일러스트 파일(.ai)에서 벡터를 그대로 뽑았다.
       원본은 흰 바탕에 청록 마크지만, 탭에서는 작아서 색을 뒤집는 편이
       또렷하다. 홈페이지 초록(#1E5B45) 판에 흰 마크로 둔다.
       손으로 다시 그리지 말 것 — 원본과 어긋난다.

       크기를 정할 때 기준은 사각 칸이 아니라 「안에 그려지는 원」이다.
       구글은 검색 결과에서 파비콘을 동그랗게 잘라 보여준다. 칸을 꽉 채우면
       아치 양 끝과 물결이 원 밖으로 나가 잘리고, 남은 가운데만 보여서
       알아볼 수 없는 무늬가 된다.
       그래서 마크에서 가장 먼 점(아치 아래 모서리, 중심에서 57.5)이
       반지름 32 안에 들어오도록 0.5401 로 줄였다. 3%는 숨 쉴 틈이다.

       획은 같은 색으로 2.6 덧대 부풀렸다. 획을 그린 것이 아니라 같은
       도형을 밖으로 밀어낸 것이라 모양은 변하지 않는다. 16픽셀에서
       아치와 물결이 살아 있으려면 이만큼은 필요하다 -->
  <g transform="translate(5.00 5.86) scale(0.5401)" fill="#fff" fill-rule="evenodd"
