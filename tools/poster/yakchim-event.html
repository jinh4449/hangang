<!doctype html>
<meta charset="utf-8">
<title>약침 할인이벤트</title>
<style>
  @font-face { font-family: "KR"; src: url("file:///root/.fonts/NotoSansKR-400.ttf"); font-weight: 400; }
  @font-face { font-family: "KR"; src: url("file:///root/.fonts/NotoSansKR-700.ttf"); font-weight: 700; }
  @font-face { font-family: "KR"; src: url("file:///root/.fonts/NotoSansKR-900.ttf"); font-weight: 900; }

  :root {
    --paper: #f4f6f4;
    --card: #ffffff;
    --ink: #141715;
    --muted: #5c665f;
    --faint: #8d958f;
    --line: #e4e8e3;
    --herb: #1e5b45;
    --herb-bright: #24785a;
    --tint: #e9f2ec;
  }
  html { zoom: 2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 1500px;
    background: var(--paper);
    color: var(--ink);
    font-family: "KR", "Pretendard", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    padding: 92px 80px 76px;
    display: flex; flex-direction: column;
  }

  /* ── 머리말 ────────────────────────────────────────── */
  .badge {
    align-self: flex-start;
    background: var(--herb); color: #fff;
    font-size: 25px; font-weight: 700; letter-spacing: 0.06em;
    padding: 13px 28px; border-radius: 999px;
  }
  h1 {
    margin-top: 36px;
    font-size: 112px; font-weight: 900; line-height: 1.14; letter-spacing: -0.05em;
  }
  h1 em { font-style: normal; color: var(--herb-bright); }
  .sub {
    margin-top: 30px;
    font-size: 31px; font-weight: 400; line-height: 1.6; color: var(--muted);
    max-width: 24em;
  }
  .sub b { font-weight: 700; color: var(--ink); }

  /* ── 시술 두 가지 ──────────────────────────────────── */
  .cards {
    margin-top: auto; margin-bottom: auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 26px;
  }
  .card {
    background: var(--card);
    border: 1px solid #eceeea;
    border-radius: 34px;
    padding: 52px 44px 50px;
    box-shadow: 0 20px 48px -22px rgba(20, 23, 21, 0.18);
    display: flex; flex-direction: column;
  }
  .card .no {
    font-size: 24px; font-weight: 900; letter-spacing: 0.14em; color: var(--herb-bright);
  }
  .card h2 {
    margin-top: 16px;
    font-size: 54px; font-weight: 900; letter-spacing: -0.04em;
  }
  .tags { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 9px; }
  .tags span {
    background: var(--tint); color: var(--herb);
    font-size: 25px; font-weight: 700; letter-spacing: -0.02em;
    padding: 9px 18px; border-radius: 10px;
  }
  .rule { margin: 34px 0 30px; border-top: 1px solid var(--line); }
  .price { display: flex; align-items: baseline; gap: 4px; letter-spacing: -0.045em; }
  .price b { font-size: 74px; font-weight: 900; }
  .price i { font-style: normal; font-size: 36px; font-weight: 900; }
  .pack {
    margin-top: 14px;
    font-size: 27px; font-weight: 700; color: var(--muted); letter-spacing: -0.02em;
  }
  .pack u { text-decoration: none; color: var(--herb-bright); font-weight: 900; }

  /* ── 꼬리말 ────────────────────────────────────────── */
  .foot {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 36px;
    border-top: 1px solid var(--line); padding-top: 30px;
  }
  .foot .note { font-size: 24px; line-height: 1.6; color: var(--muted); max-width: 30em; }
  .foot .mark { font-size: 27px; font-weight: 900; color: var(--herb); letter-spacing: -0.03em; white-space: nowrap; }
</style>

<p class="badge">선결제 혜택</p>
<h1>약침 선결제하면<br><em>1회 무료시술</em></h1>
<p class="sub">꾸준한 치료와 재발 방지를 위해, 약침을 <b>선결제하시면 1회를 무료로</b> 시술해 드립니다.</p>

<div class="cards">
  <section class="card">
    <p class="no">01</p>
    <h2>소염 약침</h2>
    <div class="tags"><span>염증제거</span><span>근육이완</span><span>통증완화</span></div>
    <div class="rule"></div>
    <p class="price"><b>25,000</b><i>원</i></p>
    <p class="pack"><u>5 + 1회</u> 선결제</p>
  </section>

  <section class="card">
    <p class="no">02</p>
    <h2>특수 약침</h2>
    <div class="tags"><span>디스크</span><span>협착증</span><span>만성통증</span></div>
    <div class="rule"></div>
    <p class="price"><b>50,000</b><i>원</i></p>
    <p class="pack"><u>5 + 1회</u> 선결제</p>
  </section>
</div>

<footer class="foot">
  <p class="note">약침치료는 비급여 항목으로 실비적용이 어려우며,<br>환불 시 정가 × 시술횟수로 차감됩니다.</p>
  <p class="mark">김포한강한의원</p>
</footer>
