<!doctype html>
<meta charset="utf-8">
<title>약침 할인이벤트</title>
<style>
  @font-face { font-family: "KR"; src: url("file:///root/.fonts/NotoSansKR-400.ttf"); font-weight: 400; }
  @font-face { font-family: "KR"; src: url("file:///root/.fonts/NotoSansKR-700.ttf"); font-weight: 700; }
  @font-face { font-family: "KR"; src: url("file:///root/.fonts/NotoSansKR-900.ttf"); font-weight: 900; }

  :root {
    --ink: #141715;
    --muted: #5c665f;
    --faint: #97a099;
    --line: #e6e9e4;
    --herb: #1e5b45;
    --herb-deep: #17462f;
    --herb-bright: #2b8a63;
    --tint: #eaf3ee;
  }
  /* A4 가로 297×210mm. 1169×827px(=100dpi)에 zoom 3 을 걸어 300dpi 로 뽑는다 */
  html { zoom: 3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1169px; height: 827px;
    background: #fff; color: var(--ink);
    font-family: "KR", "Pretendard", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    display: grid; grid-template-columns: 410px 1fr;
  }

  /* ── 왼쪽 옥색 판 ──────────────────────────────────── */
  .panel {
    background: linear-gradient(160deg, var(--herb) 0%, var(--herb-deep) 100%);
    color: #fff;
    padding: 58px 48px 46px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .panel::before {
    content: ""; position: absolute; right: -150px; top: -110px;
    width: 380px; height: 380px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
  }
  .panel .badge {
    align-self: flex-start; position: relative;
    border: 1.5px solid rgba(255, 255, 255, 0.42);
    border-radius: 999px; padding: 9px 20px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.12em;
  }
  .panel h1 {
    margin-top: 30px; position: relative;
    font-size: 60px; font-weight: 900; line-height: 1.18; letter-spacing: -0.05em;
  }
  .panel h1 em { font-style: normal; color: #9fe0c1; }
  .panel .lead {
    margin-top: 24px; position: relative;
    font-size: 19px; font-weight: 400; line-height: 1.65; color: rgba(255, 255, 255, 0.8);
  }
  .panel .lead b { color: #fff; font-weight: 700; }

  .panel .bottom { margin-top: auto; position: relative; }
  .panel .note {
    font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, 0.6);
    padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.18);
  }
  .panel .mark {
    margin-top: 18px; font-size: 20px; font-weight: 900; letter-spacing: -0.03em;
  }

  /* ── 오른쪽 가격표 ─────────────────────────────────── */
  .grid { padding: 58px 56px 46px; display: flex; flex-direction: column; }
  .colhead {
    display: grid; grid-template-columns: 1fr 174px 174px; gap: 18px;
    align-items: end; padding-bottom: 16px;
  }
  .colhead p {
    text-align: center; font-size: 17px; font-weight: 900; letter-spacing: -0.02em;
    color: var(--herb); padding-bottom: 12px;
  }
  .colhead .a, .colhead .b { border-bottom: 3px solid var(--tint); }

  .row {
    flex: 1;
    display: grid; grid-template-columns: 1fr 174px 174px; gap: 18px;
    align-items: center;
    border-top: 1px solid var(--line);
  }
  .row:last-of-type { border-bottom: 1px solid var(--line); }
  .no { font-size: 14px; font-weight: 900; letter-spacing: 0.16em; color: var(--herb-bright); }
  .name { margin-top: 8px; font-size: 42px; font-weight: 900; letter-spacing: -0.045em; }
  .tags { margin-top: 12px; font-size: 16px; font-weight: 700; color: var(--muted); letter-spacing: -0.02em; }
  .tags i { font-style: normal; color: var(--faint); padding: 0 6px; }

  .cell { text-align: center; }
  .cell .amt { font-size: 40px; font-weight: 900; letter-spacing: -0.05em; white-space: nowrap; }
  .cell .amt i { font-style: normal; font-size: 22px; }
  .cell .cnt {
    margin-top: 9px; display: inline-block;
    font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: -0.02em;
  }

  .tail {
    padding-top: 26px;
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: -0.02em;
  }
  .tail span {
    background: var(--tint); color: var(--herb); border-radius: 6px;
    padding: 6px 12px; font-weight: 900;
  }
</style>

<aside class="panel">
  <p class="badge">약침 선결제 혜택</p>
  <h1>1회 무료시술<br>또는<br><em>30% 할인</em></h1>
  <p class="lead">꾸준한 치료와 재발 방지를 위해,<br>약침을 <b>선결제하시면</b> 두 가지 혜택 중<br>하나를 골라 드립니다.</p>
  <div class="bottom">
    <p class="note">약침치료는 비급여 항목으로 실비적용이 어려우며,<br>환불 시 정가 × 시술횟수로 차감됩니다.</p>
    <p class="mark">김포한강한의원</p>
  </div>
</aside>

<main class="grid">
  <div class="colhead">
    <p></p>
    <p class="a">1회 무료시술</p>
    <p class="b">30% 할인</p>
  </div>

  <section class="row">
    <div>
      <p class="no">01</p>
      <h2 class="name">소염 약침</h2>
      <p class="tags">염증제거<i>·</i>근육이완<i>·</i>통증완화</p>
    </div>
    <div class="cell"><p class="amt">25,000<i>원</i></p><p class="cnt">5 + 1회</p></div>
    <div class="cell"><p class="amt">35,000<i>원</i></p><p class="cnt">10회</p></div>
  </section>

  <section class="row">
    <div>
      <p class="no">02</p>
      <h2 class="name">특수 약침</h2>
      <p class="tags">디스크<i>·</i>협착증<i>·</i>만성통증</p>
    </div>
    <div class="cell"><p class="amt">50,000<i>원</i></p><p class="cnt">5 + 1회</p></div>
    <div class="cell"><p class="amt">70,000<i>원</i></p><p class="cnt">10회</p></div>
  </section>

  <p class="tail"><span>선결제</span> 후 원하시는 혜택을 말씀해 주세요.</p>
</main>
